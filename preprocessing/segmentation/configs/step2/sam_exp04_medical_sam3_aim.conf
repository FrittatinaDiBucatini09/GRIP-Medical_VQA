# ==============================================================================
# MEDICAL-SAM3 (AIM-Research-Lab) EXPERIMENT CONFIGURATION
# ==============================================================================
#
# Model: AIM-Research-Lab/Medical-SAM3 — full fine-tune of SAM3 (not LoRA).
# Repo:    https://github.com/AIM-Research-Lab/Medical-SAM3
# Weights: https://huggingface.co/Chongcong/Medical-SAM3 (checkpoint.pt, ~10GB)
#
# Container image: pipeline_segmentation:sam3 (auto-selected by run_docker.sh
# because this file mentions "medsam3" / "medical_sam3" — keep that token in
# the file or the dispatcher falls back to the 3090 image).
# ==============================================================================

# Model Selection:
# Available key for the AIM family: "medical_sam3"
# Or provide a direct path to the .pt checkpoint:
#     "/workspace/checkpoints/medical_sam3_aim/checkpoint.pt"
MEDSAM_CHECKPOINT="medical_sam3"

# Text Prompt Mode (same semantics as the Joey MedSAM3 config):
#   "regions"          → visual_regions only (e.g., "trachea")
#   "regions_question" → visual_regions + question
#   "question"         → question / prompt_used only (default)
#
# If visual_regions is missing, "regions"/"regions_question" fall back to "question".
TEXT_PROMPT_MODE="question"

# Bounding Box Prompt (Optional):
# "true"  → Combine text + bbox prompts (drives the underlying Sam3Processor
#           with set_text_prompt followed by add_geometric_prompt).
# "false" → Text-only inference.
SAM3_USE_BBOX="false"

# Experiment Type (only affects SAM1/SAM2; ignored by the SAM3 families):
SCENARIO="A"

# Visualization:
SAVE_VISUALS="true"
